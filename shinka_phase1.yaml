# Phase 1: ShinkaEvolve architecture search config
# Run with: uv run python run_phase1.py --config shinka_phase1.yaml

max_evaluation_jobs: 1    # Single GPU — sequential evaluations
max_proposal_jobs: 2
max_db_workers: 2

eval_program_path: shinka_evaluate.py   # Custom field read by run_phase1.py

db_config:
  num_islands: 1
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 2
  num_top_k_inspirations: 1
  parent_selection_strategy: weighted
  parent_selection_lambda: 10
  archive_selection_strategy: "crowding"
  island_elitism: true
  enable_dynamic_islands: true
  stagnation_threshold: 10
  archive_criteria:
    combined_score: 1.0   # score = mAP50 / model_size_mb (primary)

evo_config:
  init_program_path: initial_compress.py
  results_dir: results/phase1
  language: python
  num_generations: 20
  max_api_costs: 5.0
  patch_types: [diff, full]
  patch_type_probs: [0.7, 0.3]
  max_patch_resamples: 3
  max_patch_attempts: 2
  max_novelty_attempts: 2
  job_type: local

  llm_models:
    - "gemini-2.0-flash"
  llm_kwargs:
    temperatures: [1.0]
    max_tokens: 8192

  meta_rec_interval: 5
  meta_llm_models: ["gemini-2.0-flash"]
  meta_llm_kwargs:
    temperatures: [0]
    max_tokens: 8192

  novelty_llm_models: ["gemini-2.0-flash"]
  novelty_llm_kwargs:
    temperatures: [0]

  embedding_model: gemini-embedding-exp-03-07
  code_embed_sim_threshold: 0.99

  task_sys_msg: |
    You are an expert in mobile neural network architecture design, specializing in
    efficient detection networks for ARM CPU deployment. You are evolving the neck
    and FCOS head of a MobileNetV4-Conv-Small person detector.

    Key objectives (in order):
    1. Maximize score = mAP50 / (0.5 * model_size_mb + 0.5 * cpu_latency_ms/100)
       Latency is now a first-class term: a compact model that is slow on ARM
       scores the same as a larger but faster model. Baseline = 100 ms.
    2. Keep mAP50 >= 0.15 (floor threshold — below this, score = 0)
    3. Both model_size_mb and cpu_latency_ms matter equally (alpha = 0.5)

    UIB block variant reference (set via dw_kernel_size_*):
    - Inverted Bottleneck (IB):  dw_start=0, dw_mid=3, dw_end=0
    - ConvNext-like:             dw_start=3, dw_mid=0, dw_end=0
    - ExtraDW:                   dw_start=3, dw_mid=3, dw_end=0
    - FFN/Pointwise:             dw_start=0, dw_mid=0, dw_end=0

    Architecture decisions that matter most (ONLY these may be mutated):
    - NECK_CHANNELS: wider = more capacity but larger model
    - UIB_CONFIGS exp_ratio: 2.0-8.0 range; higher = more capacity
    - HEAD_STACKS: 2-4 range
    - HEAD_CHANNELS: 32-128 range
    - FPN vs PAN: try top-down-only vs bidirectional fusion in FPNNeck

    DO NOT change LR, EPOCHS, BATCH_SIZE, or WARMUP_EPOCHS — the training
    recipe is fixed outside the EVOLVE-BLOCK so that only architecture
    differences drive score changes. Mutations to training hyperparameters
    will be rejected.

  evolve_prompts: false
