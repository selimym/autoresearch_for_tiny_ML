[project]
name = "autoresearch-tinydet"
version = "0.1.0"
description = "Autonomous person-detection compression research for ARM CPU deployment"
requires-python = ">=3.12"

dependencies = [
    # Core ML
    "torch>=2.0",
    "torchvision>=0.15",
    # Backbone + pretrained weights
    "timm>=1.0",
    # Detection evaluation
    "pycocotools>=2.0",
    # Compression + deployment
    "onnx>=1.14",
    "onnxruntime>=1.18",
    # Experiment tracking
    "mlflow>=2.0",
    # Dataset download
    "fiftyone>=0.23",
    # Phase 1: evolutionary search (installed from local clone)
    "shinka-evolve @ file:///home/selim/git_repos/ShinkaEvolve",
    # Literature search (optional)
    "semanticscholar>=0.8",
    "tavily-python>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest", "ipykernel", "jupyter"]
